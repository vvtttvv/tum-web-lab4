<style>
  @keyframes mascotEntrance {
    0%   { opacity: 0; transform: translateY(80px) scale(0.5); pointer-events: none; }
    60%  { opacity: 1; transform: translateY(-10px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  }
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-8px) rotate(3deg); }
    50%      { transform: translateY(-4px) rotate(0deg); }
    75%      { transform: translateY(-8px) rotate(-3deg); }
  }
  @keyframes mascotWiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    15%  { transform: rotate(12deg) scale(1.1); }
    30%  { transform: rotate(-10deg) scale(1.1); }
    45%  { transform: rotate(8deg) scale(1.05); }
    60%  { transform: rotate(-6deg) scale(1.05); }
    75%  { transform: rotate(3deg) scale(1); }
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25%  { transform: rotate(20deg); }
    50%  { transform: rotate(-10deg); }
    75%  { transform: rotate(15deg); }
  }

  #mascot-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    filter: drop-shadow(0 4px 12px rgba(58,125,110,.35));
    transition: filter 0.3s;
    animation: mascotEntrance 0.8s cubic-bezier(.34,1.56,.64,1) 2.5s forwards;
  }
  #mascot-container .mascot-svg {
    animation: mascotFloat 3s ease-in-out 3.3s infinite;
  }
  #mascot-container:hover .mascot-svg {
    animation: mascotWiggle 0.6s ease-in-out;
  }
  #mascot-container:hover {
    filter: drop-shadow(0 6px 20px rgba(58,125,110,.5));
  }
  #mascot-container .wave-hand {
    transform-origin: 50% 100%;
    animation: wave 2s ease-in-out infinite;
  }

  #mascot-bubble {
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 10px;
    background: #fff;
    color: #2c3e3a;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    border: 2px solid #3a7d6e;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }
  #mascot-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    right: 20px;
    border: 8px solid transparent;
    border-top-color: #3a7d6e;
  }
  #mascot-container:hover #mascot-bubble {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  #mascot-close {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #e74c3c;
    color: #fff;
    border: 2px solid #fff;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 51;
  }
  #mascot-container:hover #mascot-close {
    opacity: 1;
  }

  @media (max-width: 767px) {
    #mascot-container {
      bottom: 80px;
      right: 12px;
    }
    #mascot-container svg {
      width: 70px;
      height: 70px;
    }
    #mascot-bubble {
      font-size: 11px;
      padding: 8px 11px;
      right: -4px;
    }
  }
</style>

<script>
  document.getElementById('mascot-container').addEventListener('click', function(e) {
    if (e.target.id === 'mascot-close' || e.target.closest('#mascot-close')) return;
    document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('mascot-close').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('mascot-container').style.display = 'none';
  });
</script>
