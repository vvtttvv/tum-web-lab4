  function setLang(lang) {
    document.documentElement.lang = lang;

    const dict = translations[lang];
    if (!dict) return;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (dict[key]) el.placeholder = dict[key];
    });

    document.querySelectorAll('[data-i18n-alt]').forEach(el => {
      const key = el.getAttribute('data-i18n-alt');
      if (dict[key]) el.alt = dict[key];
    });

    document.querySelectorAll('.lang-btn-ro').forEach(btn => btn.classList.toggle('lang-btn-active', lang === 'ro'));
    document.querySelectorAll('.lang-btn-ru').forEach(btn => btn.classList.toggle('lang-btn-active', lang === 'ru'));

    localStorage.setItem('lang', lang);
  }

  function closeMobileMenu() {
    document.getElementById('mobile-menu').classList.add('hidden');
  }

  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('lang');
    if (saved && saved !== 'ro') setLang(saved);

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  });
